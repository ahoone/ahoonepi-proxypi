[project]
name = "proxypi-cli"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "typer==0.27.1",
    "pydantic==2.12.5",
    "pydantic_core==2.41.5",
    "pydantic-settings==2.15.0",
]

[project.scripts]
proxypi = "proxypi.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/proxypi",
]
