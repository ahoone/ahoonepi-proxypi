services:
  test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tests
    environment:
      HTTP_PORT_BROKER: ${HTTP_PORT_BROKER}
      HTTP_PORT_SCRAPER: ${HTTP_PORT_SCRAPER}
      WIREGUARD_NETWORK_PREFIX: ${WIREGUARD_NETWORK_PREFIX}
    command: ["pytest", "-v", "-s"]
    restart: "no"
