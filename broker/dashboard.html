<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>

<div class="stats-row" id="stats">
  <div class="stat-card c-total">
    <div class="stat-label">Total Nodes</div>
    <div class="stat-value" id="s-total">—</div>
  </div>
  <div class="stat-card c-online">
    <div class="stat-label">Online</div>
    <div class="stat-value" id="s-online">—</div>
  </div>
  <div class="stat-card c-ssh">
    <div class="stat-label">Offline</div>
    <div class="stat-value" id="s-offline">—</div>
  </div>
  <div class="stat-card c-net">
    <div class="stat-label">Browser Instances</div>
    <div class="stat-value" id="s-browsers">—</div>
  </div>
</div>

<div class="table-wrap">
  <div class="table-header">
    <span class="table-title">Nodes</span>
    <button class="refresh-btn" id="refreshBtn" onclick="fetchNodes()">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/>
      </svg>
      Refresh
    </button>
  </div>
  <div id="table-container">
    <div class="empty-state">Loading...</div>
  </div>
</div>

<div class="table-wrap">
  <div class="table-header">
    <span class="table-title">Broker</span>
    <div class="meta">
      <span><span class="live-dot"></span> &nbsp;live</span>
      <span id="ts-broker" class="ts">—</span>
    </div>
  </div>
  <div id="broker-container">
    <div class="empty-state">Loading...</div>
  </div>
</div>

<script>
  // ── CONFIG ──────────────────────────────────────
  const API_URL = '/nodes';
  const AUTO_REFRESH_MS = 1_000;
  // ────────────────────────────────────────────────

  // ── Generic in-place table upsert ───────────────
  // Updates existing rows/cells without recreating DOM nodes,
  // so CSS animations (blinking dots) never restart.
  function upsertTable(container, rows, rowKey, columns) {
    let table = container.querySelector('table');

    // First render — build skeleton
    if (!table) {
      container.innerHTML =
        '<table><thead><tr>' +
        columns.map(c => '<th>' + c.label + '</th>').join('') +
        '</tr></thead><tbody></tbody></table>';
      table = container.querySelector('table');
    }

    const tbody = table.querySelector('tbody');
    const seen  = new Set();

    rows.forEach(function(r, idx) {
      const key = String(rowKey(r));
      seen.add(key);

      let tr = tbody.querySelector('[data-key="' + key + '"]');

      if (!tr) {
        tr = document.createElement('tr');
        tr.dataset.key = key;
        columns.forEach(function() { tr.appendChild(document.createElement('td')); });
        tbody.appendChild(tr);
      }

      // Keep row in sorted order without moving it if already correct
      const siblings = [...tbody.children];
      if (siblings.indexOf(tr) !== idx) {
        tbody.insertBefore(tr, tbody.children[idx] || null);
      }

      // Update only cells whose content actually changed
      columns.forEach(function(col, i) {
        const next = col.render(r);
        if (tr.children[i].innerHTML !== next) {
          tr.children[i].innerHTML = next;
        }
      });

      // Sync row-level classes
      const isLighthouse = r.node_id === 1;
    });

    // Remove rows that no longer exist in the data
    [...tbody.querySelectorAll('tr')].forEach(function(tr) {
      if (!seen.has(tr.dataset.key)) tr.remove();
    });
  }

  // ── Nodes ────────────────────────────────────────
  const NODE_COLUMNS = [
    {
      label: 'Hostname',
      render: function(r) {
        const isLighthouse    = r.node_id === 1;
        const dotClass     = (isLighthouse) ? 'lighthouse' : (r.online ? 'online' : 'offline');
        return '<div class="host-cell">' +
          '<span class="host-dot ' + dotClass + '"></span>' +
          r.hostname +
          (isLighthouse ? ' <span class="badge badge-lh">LIGHTHOUSE</span>' : '') +
          '</div>';
      }
    },
    {
      label: 'Node ID ↓',
      render: function(r) {
        return r.node_id === 1
          ? '<span class="node-id">' + r.node_id + '</span>'
          : '<span class="node-id">' + (r.node_id != null ? r.node_id : '—') + '</span>';
      }
    },
    {
      label: 'IPv6',
      render: function(r) {
        return '<span class="ipv6-cell" title="' + (r.ipv6 || '') + '">' + (r.ipv6 || '—') + '</span>';
      }
    },
    {
      label: 'Status',
      render: function(r) {
        return r.status
          ? '<span class="badge badge-status">' + r.status + '</span>'
          : '<span class="lat-none">—</span>';
      }
    },
    {
      label: 'Browsers',
      render: function(r) {
        const n = Array.isArray(r.browser_instances) ? r.browser_instances.length : 0;
        return n > 0
          ? '<span class="browser-count">' + n + '</span>'
          : '<span class="lat-none">0</span>';
      }
    }
  ];

  function renderNodes(rawRows) {
    const container = document.getElementById('table-container');
    const rows = rawRows.filter(function(r) { return r && typeof r.hostname === 'string'; });

    if (!rows.length) {
      container.innerHTML = '<div class="empty-state">No data returned.</div>';
      return;
    }

    rows.sort(function(a, b) { return (a.node_id != null ? a.node_id : Infinity) - (b.node_id != null ? b.node_id : Infinity); });
    upsertTable(container, rows, function(r) { return r.node_id; }, NODE_COLUMNS);

    // Stats
    const onlineCount   = rows.filter(function(r) { return r.online; }).length;
    const totalBrowsers = rows.reduce(function(s, r) { return s + (Array.isArray(r.browser_instances) ? r.browser_instances.length : 0); }, 0);
    document.getElementById('s-total').textContent    = rows.length;
    document.getElementById('s-online').textContent   = onlineCount;
    document.getElementById('s-offline').textContent  = rows.length - onlineCount;
    document.getElementById('s-browsers').textContent = totalBrowsers;
    // document.getElementById('ts').textContent         = 'updated ' + new Date().toLocaleTimeString();
  }

  async function fetchNodes() {
    const btn = document.getElementById('refreshBtn');
    btn.classList.add('spinning');
    try {
      const res  = await fetch(API_URL);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      renderNodes(Array.isArray(json) ? json : (json.output || []));
    } catch (e) {
      document.getElementById('table-container').innerHTML =
        '<div class="error-state">Failed to fetch: ' + e.message + '</div>';
    } finally {
      btn.classList.remove('spinning');
    }
  }

  // ── Broker ───────────────────────────────────────
  const BROKER_COLUMNS = [
    { label: 'URI',       render: function(r) { return '<span class="uri-cell">'  + (r.uri       || '—') + '</span>'; } },
    { label: 'Timestamp ↓', render: function(r) { return '<span class="ts-cell">'   + (r.timestamp || '—') + '</span>'; } },
    { 
      label: 'Tag', 
      render: function(r) { 
        if (!r.tag) {
          return '<span class="ts-cell">—</span>';
        }
        const dynamicStyle = getTagStyle(r.tag);
        return `<span class="badge" style="${dynamicStyle}">${r.tag}</span>`;
      } 
    }
  ];

  function getTagStyle(tag) {
    if (!tag) return '';

    // Generate a hash from the tag string
    let hash = 0;
    for (let i = 0; i < tag.length; i++) {
      hash = tag.charCodeAt(i) + ((hash << 5) - hash);
    }

    // Use the hash to pick a Hue (0-360)
    const h = Math.abs(hash % 360);
    
    // S=80%, L=65% gives a vibrant "neon" color that works well in dark mode
    const color = `hsl(${h}, 80%, 65%)`;
    
    return `
      background: hsla(${h}, 80%, 65%, 0.1); 
      color: ${color}; 
      border: 1px solid hsla(${h}, 80%, 65%, 0.2);
    `;
  }

  function getTagColor(tag) {
    if (!tag) return '';
    
    // Generate a simple hash from the string
    let hash = 0;
    for (let i = 0; i < tag.length; i++) {
      hash = tag.charCodeAt(i) + ((hash << 5) - hash);
    }
    
    // Use HSL for "vibrant but readable" colors
    // Hue: 0-360, Saturation: 70%, Lightness: 85% (pastel look)
    const h = Math.abs(hash % 360);
    return `background: hsl(${h}, 70%, 90%); color: hsl(${h}, 80%, 25%); border: 1px solid hsl(${h}, 70%, 80%);`;
  }

  function renderBroker(rawRows) {
    const container = document.getElementById('broker-container');

    if (!rawRows.length) {
      container.innerHTML = '<div class="empty-state">No data returned.</div>';
      return;
    }

    upsertTable(container, rawRows, function(r) { return r.id; }, BROKER_COLUMNS);
    document.getElementById('ts-broker').textContent = 'updated ' + new Date().toLocaleTimeString();
  }

  async function fetchBroker() {
    try {
      const res  = await fetch('/scraping-list');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      renderBroker(Array.isArray(json) ? json : (json.output || []));
    } catch (e) {
      document.getElementById('broker-container').innerHTML =
        '<div class="error-state">Failed to fetch: ' + e.message + '</div>';
    }
  }

  // ── Boot ─────────────────────────────────────────
  fetchNodes();
  fetchBroker();
  if (AUTO_REFRESH_MS > 0) {
    setInterval(fetchNodes,   AUTO_REFRESH_MS);
    setInterval(fetchBroker, AUTO_REFRESH_MS);
  }
</script>
</body>
</html>
