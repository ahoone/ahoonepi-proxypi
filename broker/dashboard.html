<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Dashboard</title>
        <link rel="icon" href="data:," />
        <link rel="stylesheet" href="dashboard.css" />
    </head>
    <body>
        <main class="dashboard-grid">
            <div class="row">
                <section class="card-stat">
                    <div>Nodes:</div>
                    <span>-</span>
                </section>

                <section class="card-stat">
                    <div>Online:</div>
                    <span>-</span>
                </section>

                <section class="card-stat">
                    <div>RPM:</div>
                    <span>-</span>
                </section>
            </div>

            <div class="row">
                <section class="card nodes">
                    <div class="card-header">
                        <span class="card-title">Nodes</span>
                        <div class="card-timestamp">
                            <span id="ts-dashboard" class="timestamp">—</span>
                        </div>
                    </div>

                    <table>
                        <thead>
                            <tr>
                                <th>Hostname</th>
                                <th>Node ID</th>
                                <th>RAM</th>
                                <th>IPv6</th>
                                <th>Browsers</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>-</td>
                                <td>-</td>
                                <td>-</td>
                                <td>-</td>
                                <td>-</td>
                            </tr>
                        </tbody>
                    </table>
                </section>
            </div>

            <div class="row">
                <section class="card broker">
                    <div class="card-header">
                        <span class="card-title">Broker</span>
                    </div>

                    <table>
                        <thead>
                            <tr>
                                <th>URL</th>
                                <th>Antwortzeit</th>
                                <th>Timestamp</th>
                                <th>Tag</th>
                            </tr>
                        </thead>
                    </table>

                    <table class="running_requests">
                        <thead>
                            <td colspan="4">Running requests</td>
                        </thead>
                        <tbody>
                            <tr>
                                <td>-</td>
                                <td>-</td>
                                <td>-</td>
                                <td>-</td>
                            </tr>
                        </tbody>
                    </table>

                    <table class="unscraped_targets">
                        <thead>
                            <td colspan="4">Unscraped Targets</td>
                        </thead>
                        <tbody>
                            <tr>
                                <td>-</td>
                                <td>-</td>
                                <td>-</td>
                                <td>-</td>
                            </tr>
                        </tbody>
                    </table>
                </section>

                <section class="card logger">
                    <div class="card-header">
                        <span class="card-title">Logs</span>
                    </div>

                    <table>
                        <thead>
                            <tr>
                                <th>Timestamp</th>
                                <th>Detail</th>
                                <th>Level</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>-</td>
                                <td>-</td>
                                <td>-</td>
                            </tr>
                        </tbody>
                    </table>
                </section>
            </div>
        </main>

        <script>
            const SOCKET = "/get_broker_state";
            const REFRESH_PERIOD = 100;
            const SIZE_BUFFER_LOGS = 20;

            function upsertTable(table, rows, rowKey, columns) {
                if (!table) {
                    table.innerHTML =
                        "<table><thead><tr>" +
                        columns
                            .map(
                                (c) =>
                                    "<th" +
                                    (c.cls ? ' class="' + c.cls + '"' : "") +
                                    ">" +
                                    c.label +
                                    "</th>",
                            )
                            .join("") +
                        "</tr></thead><tbody></tbody></table>";
                    table = table.querySelector("table");
                }
                const tbody = table.querySelector("tbody");
                const seen = new Set();
                rows.forEach(function (r, idx) {
                    const key = String(rowKey(r));
                    seen.add(key);
                    let tr = tbody.querySelector('[data-key="' + key + '"]');
                    if (!tr) {
                        tr = document.createElement("tr");
                        tr.dataset.key = key;
                        columns.forEach(function () {
                            tr.appendChild(document.createElement("td"));
                        });
                        tbody.appendChild(tr);
                    }
                    const siblings = [...tbody.children];
                    if (siblings.indexOf(tr) !== idx) {
                        tbody.insertBefore(tr, tbody.children[idx] || null);
                    }
                    columns.forEach(function (col, i) {
                        if (tr.children[i].className !== (col.cls || "")) {
                            tr.children[i].className = col.cls || "";
                        }
                        const next = col.render(r);
                        if (tr.children[i].innerHTML !== next) {
                            tr.children[i].innerHTML = next;
                        }
                    });
                });
                [...tbody.querySelectorAll("tr")].forEach(function (tr) {
                    if (!seen.has(tr.dataset.key)) tr.remove();
                });
            }

            const NODE_COLUMNS = [
                {
                    label: "Hostname",
                    render: function (r) {
                        const status = r.online ? "online" : "offline";
                        return (
                            '<span class="live-dot ' +
                            status +
                            '"></span> ' +
                            (r.hostname || "—") +
                            '<span style="color: var(--text-dim)"> ' +
                            r.ram_specs +
                            "</span>"
                        );
                    },
                },
                {
                    label: "Node ID",
                    render: function (r) {
                        return r.node_id != null ? r.node_id : "—";
                    },
                },
                {
                    label: "RAM",
                    render: function (r) {
                        return r.ram_usage != null ? r.ram_usage : "—";
                    },
                },
                {
                    label: "IPv6",
                    render: function (r) {
                        return r.ipv6 || "—";
                    },
                },
                {
                    label: "Browsers",
                    render: function (r) {
                        let instances = [];

                        if (Array.isArray(r.browser_instances)) {
                            instances = r.browser_instances;
                        } else if (
                            r.browsers &&
                            typeof r.browsers === "object"
                        ) {
                            instances = Object.entries(r.browsers);
                        }

                        if (!instances.length) return "<span>—</span>";

                        return instances
                            .map(function ([name, data]) {
                                const status = data.status || "idle";
                                const url =
                                    "/stream/" +
                                    encodeURIComponent(r.hostname) +
                                    "/" +
                                    encodeURIComponent(name);
                                return (
                                    '<a href="' +
                                    url +
                                    '" class="browser-badge browser-badge--' +
                                    status +
                                    '" target="_blank">' +
                                    name +
                                    "</a>"
                                );
                            })
                            .join(" ");
                    },
                },
            ];

            const BROKER_COLUMNS = [
                {
                    label: "URL",
                    render: function (r) {
                        return r.url || "—";
                    },
                },
                {
                    label: "expected_response_time",
                    render: function (r) {
                        return r.expected_response_time || "—";
                    },
                },
                {
                    label: "Timestamp",
                    render: function (r) {
                        return r.created_at || "—";
                    },
                },
                {
                    label: "Tag",
                    render: function (r) {
                        return r.tag || "—";
                    },
                },
            ];

            const LOGS_COLUMNS = [
                {
                    label: "Timestamp",
                    render: function (r) {
                        return r.timestamp || "—";
                    },
                },
                {
                    label: "Detail",
                    render: function (r) {
                        return r.detail || "—";
                    },
                },
                {
                    label: "Level",
                    render: function (r) {
                        const level = r.level || "info";
                        return (
                            '<span class="log-level log-level--' +
                            level +
                            '">' +
                            level.toUpperCase() +
                            "</span>"
                        );
                    },
                },
            ];

            function renderNodes(rawRows) {
                const table = document.querySelector(".card.nodes table");
                const rows = Array.isArray(rawRows)
                    ? rawRows.filter(function (r) {
                          return r && typeof r.hostname === "string";
                      })
                    : [];

                upsertTable(
                    table,
                    rows,
                    function (r) {
                        return r.node_id || r.hostname;
                    },
                    NODE_COLUMNS,
                );

                if (!rows.length) {
                    table.querySelector("tbody").innerHTML =
                        '<tr><td colspan="5">No data available</td></tr>';
                    return;
                }

                const onlineCount = rows.filter(function (r) {
                    return r.online;
                }).length;
                const statsCards = document.querySelectorAll(".card-stat span");
                if (statsCards[0]) statsCards[0].textContent = rows.length;
                if (statsCards[1]) statsCards[1].textContent = onlineCount;
                if (statsCards[2])
                    statsCards[2].textContent = rows.reduce(function (sum, r) {
                        return sum + (r.rpm || 0);
                    }, 0);
            }

            function renderBroker(json) {
                function renderRunningRequests(rawRows) {
                    const table = document.querySelector(
                        "table.running_requests",
                    );
                    const rows = Array.isArray(rawRows) ? rawRows : [];
                    upsertTable(
                        table,
                        rows,
                        function (r, idx) {
                            return r.id || idx;
                        },
                        BROKER_COLUMNS,
                    );

                    if (!rows.length) {
                        const tbody = table.querySelector("tbody");
                        let placeholder = tbody.querySelector(
                            '[data-key="__empty__"]',
                        );
                        if (!placeholder) {
                            placeholder = document.createElement("tr");
                            placeholder.dataset.key = "__empty__";
                            placeholder.innerHTML =
                                '<td colspan="4">No data available</td>';
                            tbody.appendChild(placeholder);
                        }
                    }
                }

                function renderUnscrapedTargets(rawRows) {
                    const table = document.querySelector(
                        "table.unscraped_targets",
                    );
                    const rows = Array.isArray(rawRows) ? rawRows : [];
                    upsertTable(
                        table,
                        rows,
                        function (r, idx) {
                            return r.id || idx;
                        },
                        BROKER_COLUMNS,
                    );

                    if (!rows.length) {
                        const tbody = table.querySelector("tbody");
                        let placeholder = tbody.querySelector(
                            '[data-key="__empty__"]',
                        );
                        if (!placeholder) {
                            placeholder = document.createElement("tr");
                            placeholder.dataset.key = "__empty__";
                            placeholder.innerHTML =
                                '<td colspan="4">No data available</td>';
                            tbody.appendChild(placeholder);
                        }
                    }
                }

                renderRunningRequests(
                    Array.isArray(json.running_requests)
                        ? json.running_requests
                        : json.running_requests.output || [],
                );
                renderUnscrapedTargets(
                    Array.isArray(json.unscraped_targets)
                        ? json.unscraped_targets
                        : json.unscraped_targets.output || [],
                );
            }

            function renderLogs(rawRows) {
                const table = document.querySelector(".card.logger table");
                const rows = Array.isArray(rawRows) ? rawRows : [];

                if (rows.length) {
                    upsertTable(
                        table,
                        rows.slice(0, SIZE_BUFFER_LOGS),
                        function (r, idx) {
                            return r.timestamp || idx;
                        },
                        LOGS_COLUMNS,
                    );
                }
                rows.sort(function (a, b) {
                    return (
                        new Date(b.timestamp || 0) - new Date(a.timestamp || 0)
                    );
                });
            }

            async function fetchData() {
                try {
                    const res = await fetch(SOCKET);
                    if (!res.ok) throw new Error("HTTP " + res.status);
                    const json = await res.json();
                    renderNodes(
                        Array.isArray(json.nodes)
                            ? json.nodes
                            : json.nodes.output || [],
                    );
                    renderBroker(json);
                    renderLogs(
                        Array.isArray(json.logs)
                            ? json.logs
                            : json.logs.output || [],
                    );
                    document.getElementById("ts-dashboard").textContent =
                        new Date().toLocaleTimeString();
                } catch (e) {
                    console.error("Failed to fetch nodes:", e);
                }
            }

            fetchData();

            if (REFRESH_PERIOD > 0) {
                setInterval(fetchData, REFRESH_PERIOD);
            }
        </script>
    </body>
</html>
